<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no"/>
<title>City Courier · Prototype</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0E1116;color:#fff;font-family:Arial,sans-serif;overflow:hidden;touch-action:none;user-select:none}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
canvas{background:#2B2F36;max-width:100%;max-height:100%;width:auto;height:auto;border-radius:10px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
#hud{position:fixed;top:10px;left:12px;right:12px;display:flex;justify-content:space-between;gap:10px;font-weight:700;font-size:15px;pointer-events:none;text-shadow:0 1px 3px #000}
#hud .box{background:rgba(0,0,0,.45);padding:6px 10px;border-radius:8px}
#msg{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.75);padding:18px 22px;border-radius:14px;text-align:center;display:none;font-size:16px;line-height:1.5;max-width:86%}
#msg button{margin-top:12px;background:#FFB020;border:0;padding:10px 18px;border-radius:999px;font-weight:700;cursor:pointer;font-size:15px}
#pad{position:fixed;bottom:14px;left:0;right:0;display:none;justify-content:space-between;padding:0 16px;pointer-events:none}
#pad .side{display:flex;gap:12px;pointer-events:auto}
#pad button{width:76px;height:76px;border-radius:50%;border:0;background:rgba(255,255,255,.18);color:#fff;font-size:26px;font-weight:700;backdrop-filter:blur(2px)}
#pad button:active{background:rgba(255,255,255,.35)}
@media(pointer:coarse){#pad{display:flex}}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="800" height="500"></canvas></div>
<div id="hud"><div class="box" id="score">Coins: 0</div><div class="box" id="mission">Mission</div><div class="box" id="timer">60s</div></div>
<div id="msg"></div>
<div id="pad">
  <div class="side"><button id="bL">◀</button><button id="bR">▶</button></div>
  <div class="side"><button id="bB">■</button><button id="bG">▲</button></div>
</div>

<script>
// ---- original city (no real brands or maps) ----
const TILE = 40, COLS = 40, ROWS = 28;
const W = 800, H = 500;
const city = [];
function isRoad(c, r){ return c % 5 === 0 || r % 4 === 0; }
for(let r = 0; r < ROWS; r++){
  city[r] = [];
  for(let c = 0; c < COLS; c++){
    if(isRoad(c, r)) city[r][c] = 0;               // road
    else city[r][c] = ((c * 7 + r * 13) % 5) + 1;   // building, 1-5 colour
  }
}
const palette = ['#7C8B9A','#A1866F','#8FA37C','#B07A9A','#6F8FB0'];

// ---- car ----
const car = { x: 2.5*TILE, y: 2.5*TILE, a: 0, v: 0 };
let keys = {}, touch = {L:false,R:false,G:false,B:false};
addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; if(e.key===' ') e.preventDefault(); });
addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
function bindBtn(id, k){
  const el = document.getElementById(id);
  const on = e => { e.preventDefault(); touch[k] = true; };
  const off = e => { e.preventDefault(); touch[k] = false; };
  el.addEventListener('pointerdown', on); el.addEventListener('pointerup', off);
  el.addEventListener('pointercancel', off); el.addEventListener('pointerleave', off);
}
bindBtn('bL','L'); bindBtn('bR','R'); bindBtn('bG','G'); bindBtn('bB','B');

// ---- missions ----
let coins = 0, mission = null, timeLeft = 60, state = 'play', lastT = performance.now(), flash = 0;
function randomRoad(){
  while(true){
    const c = Math.floor(Math.random()*COLS), r = Math.floor(Math.random()*ROWS);
    if(isRoad(c, r) && (Math.abs(c - car.x/TILE) + Math.abs(r - car.y/TILE)) > 6) return { x: (c+0.5)*TILE, y: (r+0.5)*TILE };
  }
}
function newMission(){
  const pick = randomRoad();
  const drop = randomRoad();
  mission = { stage: 'pickup', pick, drop, label: 'Pick up the parcel' };
  timeLeft = 60;
}
function setMsg(text, button){
  const m = document.getElementById('msg');
  m.innerHTML = text + (button ? '<br/><button id="mb">' + button + '</button>' : '');
  m.style.display = 'block';
  if(button) document.getElementById('mb').onclick = () => { m.style.display = 'none'; state = 'play'; startGame(); };
}
function startGame(){ coins = 0; car.x = 2.5*TILE; car.y = 2.5*TILE; car.a = 0; car.v = 0; newMission(); }

// ---- update ----
function update(dt){
  const left = keys['arrowleft'] || keys['a'] || touch.L;
  const right = keys['arrowright'] || keys['d'] || touch.R;
  const gas = keys['arrowup'] || keys['w'] || touch.G;
  const brake = keys['arrowdown'] || keys['s'] || touch.B;

  if(gas) car.v = Math.min(car.v + 220*dt, 150);
  else car.v *= (1 - 1.2*dt);
  if(brake) car.v = Math.max(car.v - 320*dt, -60);
  if(Math.abs(car.v) > 5){
    const turn = (left ? -1 : 0) + (right ? 1 : 0);
    car.a += turn * 2.6 * dt * Math.sign(car.v);
  }

  const nx = car.x + Math.cos(car.a) * car.v * dt;
  const ny = car.y + Math.sin(car.a) * car.v * dt;
  const c = Math.floor(nx / TILE), r = Math.floor(ny / TILE);
  const hitting = c < 0 || r < 0 || c >= COLS || r >= ROWS || city[r][c] !== 0;
  if(hitting){ car.v *= -0.3; } else { car.x = nx; car.y = ny; }

  timeLeft -= dt;
  if(timeLeft <= 0){ coins = Math.max(0, coins - 20); newMission(); flash = 1; }

  if(mission){
    const target = mission.stage === 'pickup' ? mission.pick : mission.drop;
    if(Math.hypot(car.x - target.x, car.y - target.y) < 26){
      if(mission.stage === 'pickup'){ mission.stage = 'drop'; mission.label = 'Deliver the parcel'; }
      else { coins += 100 + Math.ceil(timeLeft); newMission(); flash = 1; }
    }
  }
  flash = Math.max(0, flash - dt * 2);
}

// ---- draw ----
function draw(){
  const ctx = document.getElementById('c').getContext('2d');
  ctx.clearRect(0,0,W,H);
  const camX = Math.min(Math.max(car.x - W/2, 0), COLS*TILE - W);
  const camY = Math.min(Math.max(car.y - H/2, 0), ROWS*TILE - H);
  ctx.save(); ctx.translate(-camX, -camY);

  for(let r = 0; r < ROWS; r++) for(let c = 0; c < COLS; c++){
    const x = c*TILE, y = r*TILE;
    if(city[r][c] === 0){
      ctx.fillStyle = '#3A3F47'; ctx.fillRect(x, y, TILE, TILE);
      ctx.strokeStyle = '#E8D27A'; ctx.setLineDash([8,8]); ctx.lineWidth = 2;
      if(c % 5 === 0 && r % 4 !== 0){ ctx.beginPath(); ctx.moveTo(x+TILE/2, y); ctx.lineTo(x+TILE/2, y+TILE); ctx.stroke(); }
      if(r % 4 === 0 && c % 5 !== 0){ ctx.beginPath(); ctx.moveTo(x, y+TILE/2); ctx.lineTo(x+TILE, y+TILE/2); ctx.stroke(); }
      ctx.setLineDash([]);
    } else {
      ctx.fillStyle = palette[city[r][c]-1]; ctx.fillRect(x+3, y+3, TILE-6, TILE-6);
      ctx.fillStyle = 'rgba(255,255,255,.12)'; ctx.fillRect(x+6, y+6, TILE-12, 8);
    }
  }

  if(mission){
    const t = mission.stage === 'pickup' ? mission.pick : mission.drop;
    const pulse = 10 + Math.sin(performance.now()/180)*4;
    ctx.beginPath(); ctx.arc(t.x, t.y, pulse, 0, Math.PI*2);
    ctx.fillStyle = mission.stage === 'pickup' ? 'rgba(255,200,40,.85)' : 'rgba(60,220,120,.85)';
    ctx.fill();
  }

  ctx.save(); ctx.translate(car.x, car.y); ctx.rotate(car.a);
  ctx.fillStyle = '#D9423A'; ctx.fillRect(-14, -9, 28, 18);
  ctx.fillStyle = '#9DD7F0'; ctx.fillRect(2, -7, 9, 14);
  ctx.fillStyle = '#222'; ctx.fillRect(-16,-11,5,5); ctx.fillRect(-16,6,5,5); ctx.fillRect(11,-11,5,5); ctx.fillRect(11,6,5,5);
  ctx.restore();
  ctx.restore();

  if(flash > 0){ ctx.fillStyle = 'rgba(255,255,255,'+(flash*0.15)+')'; ctx.fillRect(0,0,W,H); }
}

// ---- HUD ----
function hud(){
  document.getElementById('score').textContent = 'Coins: ' + coins;
  document.getElementById('timer').textContent = Math.max(0, Math.ceil(timeLeft)) + 's';
  document.getElementById('mission').textContent = mission ? mission.label : '';
}

// ---- loop ----
function loop(t){
  const dt = Math.min(0.05, (t - lastT) / 1000); lastT = t;
  if(state === 'play'){ update(dt); }
  draw(); hud();
  requestAnimationFrame(loop);
}
startGame();
requestAnimationFrame(loop);
setMsg('Drive to the yellow mark to collect the parcel, then take it to the green mark. Each delivery earns coins, and the faster you are, the more you earn.', 'Start');
state = 'menu';
</script>
</body>
</html>
